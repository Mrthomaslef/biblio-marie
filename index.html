<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BiblioMarie — Infectiologie pédiatrique</title>
  <meta name="description" content="Veille bibliographique en infectiologie pédiatrique et adulte : synthèses en français, impact factor, abstracts, PDF et Zotero." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d141c" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BiblioMarie" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafb;
      --ink: #0f1d2c;
      --ink-2: #44515f;
      --ink-3: #7b8794;
      --line: #e3e8ed;
      --line-2: #edf1f4;
      --brand: #0b5f73;
      --brand-ink: #ffffff;
      --brand-soft: #e6f2f4;
      --if-bg: #0f1d2c;
      --if-ink: #ffffff;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --serif: 'Source Serif 4', Georgia, serif;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(15, 29, 44, .05), 0 1px 1px rgba(15, 29, 44, .03);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d141c;
        --surface: #131c26;
        --surface-2: #17212c;
        --ink: #e8edf2;
        --ink-2: #aab5c0;
        --ink-3: #74818e;
        --line: #233140;
        --line-2: #1c2834;
        --brand: #4fb3c8;
        --brand-ink: #0d141c;
        --brand-soft: #16303a;
        --if-bg: #e8edf2;
        --if-ink: #0d141c;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { overflow: hidden; }
    a { color: inherit; }
    button, select, input { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }

    .container { max-width: 920px; margin: 0 auto; padding: 0 20px; }

    /* ---------- En-tête ---------- */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
    .topbar .container { display: flex; align-items: center; gap: 14px; height: 64px; }
    .logo { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
    .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
    .brand p { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
    .topbar .stat { margin-left: auto; text-align: right; font-size: 12px; color: var(--ink-3); line-height: 1.3; }
    .topbar .stat b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }

    .toolbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
    .search { display: flex; align-items: center; gap: 10px; padding: 12px 0 4px; }
    .search svg { color: var(--ink-3); flex-shrink: 0; }
    .search input {
      flex: 1; border: 0; background: transparent; outline: none; font-size: 15px; padding: 6px 0; color: var(--ink);
    }
    .search input::placeholder { color: var(--ink-3); }
    .search select {
      border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 5px 8px;
      font-size: 12.5px; color: var(--ink-2); cursor: pointer; outline: none;
    }
    .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      white-space: nowrap; padding: 10px 10px 11px; font-size: 13px; font-weight: 500; color: var(--ink-3);
      border-bottom: 2px solid transparent;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
    .tabs .n { font-size: 11px; color: var(--ink-3); margin-left: 4px; font-weight: 500; }

    /* ---------- Liste ---------- */
    main { padding: 22px 0 40px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
    .section-head h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
    .section-head p { font-size: 12.5px; color: var(--ink-3); }

    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px 18px 15px; margin-bottom: 10px; cursor: pointer; position: relative;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .card.unread::before {
      content: ""; position: absolute; left: -1px; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand);
    }
    .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
    .journal { font-weight: 600; color: var(--ink); }
    .if {
      display: inline-flex; align-items: baseline; gap: 3px; background: var(--if-bg); color: var(--if-ink);
      font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; font-variant-numeric: tabular-nums;
    }
    .if small { font-size: 9.5px; font-weight: 500; opacity: .75; letter-spacing: .03em; }
    .design {
      font-size: 11px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 5px;
    }
    .date { margin-left: auto; white-space: nowrap; }
    .card h3 { font-family: var(--serif); font-size: 18.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 9px 0 6px; }
    .card .sum { color: var(--ink-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row3 { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
    .rub { display: inline-flex; align-items: center; gap: 6px; }
    .rub i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); display: inline-block; }
    .pill-pdf { font-weight: 600; color: var(--ink-2); }
    .empty { text-align: center; color: var(--ink-3); padding: 60px 0; }

    footer { text-align: center; font-size: 12px; color: var(--ink-3); padding: 10px 20px calc(env(safe-area-inset-bottom) + 34px); line-height: 1.8; }
    footer button { color: var(--brand); font-weight: 500; font-size: 12.5px; }

    /* ---------- Fiche article ---------- */
    .reader { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
      transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
    .reader.open { transform: none; visibility: visible; }
    .rbar { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
    .rbar .container { max-width: 760px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .back { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; color: var(--brand); padding: 8px 0; }
    .rbar .crumb { font-size: 12.5px; color: var(--ink-3); }
    .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--brand); width: 0; }

    .doc { max-width: 760px; margin: 0 auto; padding: 22px 20px 50px; }
    .doc .head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 18px; box-shadow: var(--shadow); }
    .doc h1 { font-family: var(--serif); font-size: clamp(22px, 5.4vw, 28px); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; margin: 12px 0 8px; }
    .doc .orig { font-size: 13.5px; color: var(--ink-3); font-style: italic; }
    .facts { margin-top: 16px; border-top: 1px solid var(--line-2); }
    .facts div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
    .facts dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding-top: 2px; }
    .facts dd { font-size: 13.5px; color: var(--ink); }

    .block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; margin-top: 12px; box-shadow: var(--shadow); }
    .block h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
    .block p.lead { font-size: 15.5px; line-height: 1.7; color: var(--ink); }
    ul.kp { list-style: none; }
    ul.kp li { position: relative; padding: 8px 0 8px 22px; border-top: 1px solid var(--line-2); font-size: 14.5px; }
    ul.kp li:first-child { border-top: 0; padding-top: 2px; }
    ul.kp li::before { content: ""; position: absolute; left: 4px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
    ul.kp li:first-child::before { top: 10px; }
    .block.practice { background: var(--brand-soft); border-color: transparent; }
    .block.practice h2 { color: var(--brand); }
    .block.practice p { font-size: 15px; font-weight: 500; line-height: 1.6; }
    .cite { font-family: var(--serif); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
    .cite-actions { margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; font-weight: 500; }
    .cite-actions a, .cite-actions button { color: var(--brand); text-decoration: none; }
    .cite-actions a:hover, .cite-actions button:hover { text-decoration: underline; }
    details.abs summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    details.abs summary::-webkit-details-marker { display: none; }
    details.abs summary h2 { margin: 0; }
    details.abs summary::after { content: "Afficher"; font-size: 12.5px; color: var(--brand); font-weight: 500; }
    details.abs[open] summary::after { content: "Masquer"; }
    details.abs .en { margin-top: 12px; font-size: 14px; color: var(--ink-2); white-space: pre-line; line-height: 1.65; }
    .tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; }
    .next { display: block; width: 100%; text-align: left; margin-top: 22px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: var(--radius); }
    .next small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
    .next span { display: block; font-family: var(--serif); font-size: 16.5px; font-weight: 600; margin-top: 4px; }
    .next:hover span { color: var(--brand); }

    /* ---------- Zotero ---------- */
    .sheet-bg { position: fixed; inset: 0; background: rgba(8, 15, 22, .4); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet-bg.open { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; background: var(--surface); border-radius: 14px 14px 0 0;
      max-width: 520px; margin: 0 auto; padding: 22px 22px calc(env(safe-area-inset-bottom) + 22px);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .sheet.open { transform: none; }
    .sheet h3 { font-size: 17px; font-weight: 700; }
    .sheet p { color: var(--ink-2); font-size: 13.5px; margin: 4px 0 14px; }
    .sheet input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); outline: none; font-size: 14px; }
    .sheet input:focus { border-color: var(--brand); }
    .sheet .go { width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-weight: 600; font-size: 14px; }
    .sheet .go:disabled { opacity: .6; }
    .sheet .log { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); min-height: 1em; }
    .sheet .alt { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); text-align: center; }
    .sheet .alt a { color: var(--brand); }

    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translate(-50%, 16px); opacity: 0;
      background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; padding: 9px 15px; border-radius: 8px; z-index: 100; transition: all .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 560px) {
      .topbar .stat { display: none; }
      .card { padding: 14px 15px 13px; }
      .card h3 { font-size: 17.5px; }
      .date { margin-left: 0; }
      .doc .head, .block { padding-left: 17px; padding-right: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <img class="logo" src="assets/icon.svg" alt="" />
      <div class="brand">
        <h1>BiblioMarie</h1>
        <p>Veille bibliographique · Infectiologie pédiatrique</p>
      </div>
      <div class="stat"><b id="statUnread">–</b>non lus</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="container">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher un article, un germe, une molécule…" autocomplete="off" oninput="render()" />
        <select id="sort" onchange="render()" aria-label="Trier">
          <option value="date">Plus récents</option>
          <option value="if">Impact factor</option>
        </select>
      </div>
      <nav class="tabs" id="tabs" aria-label="Rubriques"></nav>
    </div>
  </div>

  <main class="container">
    <div class="section-head"><h2 id="secTitle"></h2><p id="secInfo"></p></div>
    <div id="list"></div>
  </main>

  <footer>
    <div id="foot"></div>
    <button onclick="openSheet()">Exporter vers Zotero</button>
  </footer>

  <section class="reader" id="reader" aria-hidden="true">
    <div class="rbar"><div class="container">
      <button class="back" onclick="closeArticle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Bibliographie
      </button>
      <span class="crumb" id="crumb"></span>
    </div><span class="progress" id="bar"></span></div>
    <div class="doc" id="doc"></div>
  </section>

  <div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Zotero">
    <h3>Exporter vers Zotero</h3>
    <p id="sheetText"></p>
    <input id="zkey" type="password" placeholder="Clé API Zotero (zotero.org/settings/keys)" autocomplete="off" />
    <button class="go" id="zgo" onclick="zoteroGo()">Envoyer</button>
    <div class="log" id="zlog"></div>
    <div class="alt">ou importer un fichier : <a href="exports/bibliomarie_zotero.ris" download>RIS</a> · <a href="exports/bibliomarie_zotero.bib" download>BibTeX</a></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="data/embedded_data.js"></script>
  <script>
    const DATA = window.BIBLIO || { categories: [], articles: [] };
    const ARTS = DATA.articles;
    const CATS = DATA.categories;
    const catOf = id => CATS.find(c => c.id === id) || {};
    const READ_KEY = 'bibliomarie_read';
    const ZKEY = 'bibliomarie_zotero_key';
    const COLLECTION = 'BiblioMarie — Pédiatrie & Infectiologie';
    const read = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
    let current = 'all';
    let currentPmid = null;
    let zoteroTarget = null;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const fmtIF = v => (v == null ? '' : Number(v).toFixed(1).replace('.', ','));
    const shortDate = a => a.pub_date_fr.replace(/^(\p{L})/u, m => m.toUpperCase());

    function ifBadge(a) {
      return a.impact_factor == null ? '' : `<span class="if" title="Impact factor 2024 (JCR 2025)"><small>IF</small>${fmtIF(a.impact_factor)}</span>`;
    }

    function renderTabs() {
      const count = id => id === 'all' ? ARTS.length : ARTS.filter(a => a.category_id === id).length;
      const items = [{ id: 'all', label: 'Tout' }, ...CATS];
      document.getElementById('tabs').innerHTML = items.map(c =>
        `<button class="${c.id === current ? 'on' : ''}" onclick="setTab('${c.id}')">${esc(c.label)}<span class="n">${count(c.id)}</span></button>`).join('');
    }
    function setTab(id) {
      current = id;
      renderTabs();
      render();
      document.querySelector('#tabs .on')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filtered() {
      const q = norm(document.getElementById('q').value.trim());
      const list = ARTS.filter(a => {
        if (current !== 'all' && a.category_id !== current) return false;
        if (!q) return true;
        const hay = norm([a.title_fr, a.title, a.summary_fr, a.journal, a.journal_short, a.authors_list.join(' '), a.study_fr, a.design, (a.tags || []).join(' '), a.key_points_fr.join(' ')].join(' '));
        return q.split(/\s+/).every(w => hay.includes(w));
      });
      if (document.getElementById('sort').value === 'if') {
        list.sort((x, y) => (y.impact_factor ?? -1) - (x.impact_factor ?? -1) || y.pub_date.localeCompare(x.pub_date));
      }
      return list;
    }

    function card(a) {
      const c = catOf(a.category_id);
      return `<article class="card ${read.has(a.pmid) ? '' : 'unread'}" onclick="openArticle('${a.pmid}')">
        <div class="row1"><span class="journal">${esc(a.journal_short)}</span>${ifBadge(a)}<span class="design">${esc(a.design)}</span><span class="date">${esc(shortDate(a))}</span></div>
        <h3>${esc(a.title_fr)}</h3>
        <p class="sum">${esc(a.summary_fr)}</p>
        <div class="row3"><span class="rub" style="--c:${c.color}"><i></i>${esc(c.label)}</span><span>${esc(a.audience)}</span>${a.pdf_file ? '<span class="pill-pdf">PDF</span>' : ''}</div>
      </article>`;
    }

    function render() {
      const list = filtered();
      const c = current === 'all' ? null : catOf(current);
      document.getElementById('secTitle').textContent = c ? c.label : 'Toutes les publications';
      document.getElementById('secInfo').textContent = `${list.length} article${list.length > 1 ? 's' : ''}`;
      document.getElementById('list').innerHTML = list.length ? list.map(card).join('') : '<p class="empty">Aucun article ne correspond à la recherche.</p>';
      const unread = ARTS.filter(a => !read.has(a.pmid)).length;
      document.getElementById('statUnread').textContent = `${unread} / ${ARTS.length}`;
    }

    function vancouver(a) {
      const au = a.authors_list.length > 6 ? a.authors_list.slice(0, 6).join(', ') + ', et al' : a.authors_list.join(', ');
      let s = `${au}. ${a.title}. ${a.journal_short}. ${a.year}`;
      if (a.volume) s += `;${a.volume}`;
      if (a.issue) s += `(${a.issue})`;
      if (a.pages) s += `:${a.pages}`;
      s += '.';
      if (a.doi) s += ` doi:${a.doi}.`;
      s += ` PMID: ${a.pmid}.`;
      return s;
    }

    function openArticle(pmid, push = true) {
      const a = ARTS.find(x => x.pmid === String(pmid));
      if (!a) return;
      const alreadyOpen = !!currentPmid;
      currentPmid = a.pmid;
      const c = catOf(a.category_id);
      const list = filtered();
      const i = list.findIndex(x => x.pmid === a.pmid);
      const next = list[i + 1] || ARTS.find(x => x.pmid !== a.pmid && !read.has(x.pmid));
      document.getElementById('crumb').textContent = c.label;
      document.getElementById('doc').innerHTML = `
        <div class="head">
          <div class="row1"><span class="journal">${esc(a.journal)}</span>${ifBadge(a)}<span class="design">${esc(a.design)}</span></div>
          <h1>${esc(a.title_fr)}</h1>
          <p class="orig">${esc(a.title)}</p>
          <dl class="facts">
            <div><dt>Schéma</dt><dd>${esc(a.study_fr)}</dd></div>
            <div><dt>Population</dt><dd>${esc(a.audience)}</dd></div>
            <div><dt>Publication</dt><dd>${esc(shortDate(a))}</dd></div>
            <div><dt>Rubrique</dt><dd>${esc(c.label)}</dd></div>
          </dl>
        </div>
        <section class="block"><h2>Synthèse</h2><p class="lead">${esc(a.summary_fr)}</p></section>
        <section class="block"><h2>Points clés</h2><ul class="kp">${a.key_points_fr.map(p => `<li>${esc(p)}</li>`).join('')}</ul></section>
        <section class="block practice"><h2>Implication pratique</h2><p>${esc(a.pratique_fr)}</p></section>
        <section class="block">
          <details class="abs"><summary><h2>Abstract original</h2></summary>
            <p class="en">${a.abstract_en ? esc(a.abstract_en) : "Pas d'abstract indexé sur PubMed pour ce texte."}</p>
          </details>
        </section>
        <section class="block">
          <h2>Référence</h2>
          <p class="cite">${esc(vancouver(a))}</p>
          <div class="tags">${(a.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
          <div class="cite-actions">
            <a href="${esc(a.article_url)}" target="_blank" rel="noopener">Texte intégral ↗</a>
            ${a.pdf_file ? `<a href="${esc(a.pdf_file)}" target="_blank" rel="noopener">PDF ↗</a>` : ''}
            <a href="${esc(a.pubmed_url)}" target="_blank" rel="noopener">PubMed ↗</a>
            <button onclick="copyRef('${a.pmid}')">Copier la référence</button>
            <button onclick="openSheet('${a.pmid}')">Zotero</button>
          </div>
        </section>
        ${next ? `<button class="next" onclick="openArticle('${next.pmid}')"><small>Article suivant</small><span>${esc(next.title_fr)}</span></button>` : ''}`;
      const r = document.getElementById('reader');
      r.classList.add('open');
      r.setAttribute('aria-hidden', 'false');
      r.scrollTop = 0;
      document.body.classList.add('locked');
      read.add(a.pmid);
      localStorage.setItem(READ_KEY, JSON.stringify([...read]));
      if (push && !alreadyOpen) history.pushState({ pmid: a.pmid }, '', `#${a.pmid}`);
      else history.replaceState({ pmid: a.pmid }, '', `#${a.pmid}`);
    }

    function closeArticle(fromPop = false) {
      const r = document.getElementById('reader');
      r.classList.remove('open');
      r.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('locked');
      currentPmid = null;
      render();
      if (!fromPop && location.hash) history.back();
    }

    async function copyRef(pmid) {
      const a = ARTS.find(x => x.pmid === pmid);
      try { await navigator.clipboard.writeText(vancouver(a)); toast('Référence copiée'); }
      catch { toast('Copie impossible'); }
    }

    document.getElementById('reader').addEventListener('scroll', e => {
      const el = e.target;
      document.getElementById('bar').style.width = (100 * el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight)).toFixed(1) + '%';
    });
    window.addEventListener('popstate', () => {
      const h = location.hash.slice(1);
      if (h && ARTS.some(a => a.pmid === h)) openArticle(h, false);
      else if (currentPmid) closeArticle(true);
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('sheet').classList.contains('open')) closeSheet();
      else if (currentPmid) closeArticle();
    });

    /* ---------- Zotero ---------- */
    function openSheet(pmid = null) {
      zoteroTarget = pmid;
      const a = pmid && ARTS.find(x => x.pmid === pmid);
      document.getElementById('sheetText').textContent = a
        ? `Ajoute cet article à la collection « ${COLLECTION} », avec la synthèse en note.`
        : `Envoie les ${ARTS.length} articles dans la collection « ${COLLECTION} », avec la synthèse en note et le PDF quand il est en accès libre.`;
      document.getElementById('zgo').textContent = a ? 'Ajouter cet article' : `Envoyer les ${ARTS.length} articles`;
      document.getElementById('zkey').value = localStorage.getItem(ZKEY) || '';
      document.getElementById('zlog').textContent = '';
      document.getElementById('sheet').classList.add('open');
      document.getElementById('sheetBg').classList.add('open');
    }
    function closeSheet() {
      document.getElementById('sheet').classList.remove('open');
      document.getElementById('sheetBg').classList.remove('open');
    }
    const zlog = m => { document.getElementById('zlog').textContent = m; };

    async function zfetch(path, key, opts = {}) {
      const r = await fetch(`https://api.zotero.org${path}`, { ...opts, headers: { 'Zotero-API-Version': '3', 'Zotero-API-Key': key, 'Content-Type': 'application/json' } });
      if (!r.ok) throw new Error(r.status === 403 ? 'Clé refusée : vérifier les droits en écriture.' : `Erreur Zotero (${r.status})`);
      return r.json();
    }
    async function zCollection(key) {
      const uid = (await zfetch(`/keys/${encodeURIComponent(key)}`, key)).userID;
      const cols = await zfetch(`/users/${uid}/collections?limit=100`, key);
      const found = cols.find(c => c.data && c.data.name === COLLECTION);
      if (found) return { uid, col: found.key };
      const made = await zfetch(`/users/${uid}/collections`, key, { method: 'POST', body: JSON.stringify([{ name: COLLECTION }]) });
      return { uid, col: made.successful['0'].key };
    }
    function noteHTML(a) {
      return `<h2>${esc(a.title_fr)}</h2><p><em>${esc(a.design)} — ${esc(a.study_fr)}</em></p><h3>Synthèse</h3><p>${esc(a.summary_fr)}</p>` +
        `<h3>Points clés</h3><ul>${a.key_points_fr.map(p => `<li>${esc(p)}</li>`).join('')}</ul><h3>Implication pratique</h3><p>${esc(a.pratique_fr)}</p>`;
    }
    async function zPush(a, uid, col, key) {
      const base = location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');
      const creators = a.authors_list.map(n => {
        const p = n.trim().split(/\s+/);
        return p.length > 1 ? { creatorType: 'author', firstName: p.pop(), lastName: p.join(' ') } : { creatorType: 'author', name: n };
      });
      const res = await zfetch(`/users/${uid}/items`, key, { method: 'POST', body: JSON.stringify([{
        itemType: 'journalArticle', title: a.title, creators, publicationTitle: a.journal, journalAbbreviation: a.journal_short,
        volume: a.volume, issue: a.issue, pages: a.pages, date: a.pub_date || String(a.year), DOI: a.doi, url: a.article_url,
        abstractNote: a.abstract_en, extra: `PMID: ${a.pmid}`, collections: [col],
        tags: [...(a.tags || []), a.category_label, a.design, 'BiblioMarie'].filter(Boolean).map(tag => ({ tag }))
      }]) });
      const parent = res.successful?.['0']?.key;
      if (!parent) throw new Error('Création refusée par Zotero');
      const kids = [{ itemType: 'note', parentItem: parent, note: noteHTML(a), tags: [{ tag: 'Synthèse FR' }] }];
      if (a.pdf_file) kids.push({ itemType: 'attachment', parentItem: parent, linkMode: 'linked_url', title: `PDF — PMID ${a.pmid}`, contentType: 'application/pdf', url: `${base}/${a.pdf_file}` });
      await zfetch(`/users/${uid}/items`, key, { method: 'POST', body: JSON.stringify(kids) });
    }
    async function zoteroGo() {
      const key = document.getElementById('zkey').value.trim();
      if (!key) return zlog('Clé API requise.');
      localStorage.setItem(ZKEY, key);
      const btn = document.getElementById('zgo');
      btn.disabled = true;
      try {
        zlog('Connexion à Zotero…');
        const { uid, col } = await zCollection(key);
        const todo = zoteroTarget ? ARTS.filter(a => a.pmid === zoteroTarget) : ARTS;
        for (let i = 0; i < todo.length; i++) { zlog(`Envoi ${i + 1} / ${todo.length}…`); await zPush(todo[i], uid, col, key); }
        closeSheet();
        toast(todo.length > 1 ? `${todo.length} articles ajoutés à Zotero` : 'Article ajouté à Zotero');
      } catch (e) { zlog(e.message); }
      finally { btn.disabled = false; }
    }

    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    (function init() {
      const b = DATA.built ? new Date(DATA.built).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      document.getElementById('foot').textContent = `${ARTS.length} articles · mise à jour le ${b} · Impact factor : JCR 2025 (IF 2024)`;
      renderTabs();
      render();
      const h = location.hash.slice(1);
      if (h && ARTS.some(a => a.pmid === h)) { history.replaceState(null, '', location.pathname); openArticle(h); }
    })();
  </script>
</body>
</html>
